<svg width="220" height="48" viewBox="0 0 220 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Bar 1 Gradient: Growth -->
    <linearGradient id="svgBar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <!-- Bar 2 Gradient: Progress -->
    <linearGradient id="svgBar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <!-- Bar 3 Gradient: Collaboration & Building -->
    <linearGradient id="svgBar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <!-- Spark Gradient: Innovation, AI, Creativity -->
    <linearGradient id="svgSpark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#FF3DF5" />
    </linearGradient>
    <filter id="svgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="34" cy="12" r="14" fill="#00D9FF" opacity="0.3" filter="blur(6px)" />

  <!-- 3 Vertical Bars (Increasing in Height) -->
  <!-- Bar 1: Developer Growth -->
  <rect x="6" y="24" width="7" height="16" rx="3.5" fill="url(#svgBar1)" />
  <!-- Bar 2: Progress -->
  <rect x="17" y="16" width="7" height="24" rx="3.5" fill="url(#svgBar2)" />
  <!-- Bar 3: Collaboration & Building Together -->
  <rect x="28" y="8" width="7.5" height="32" rx="3.75" fill="url(#svgBar3)" filter="url(#svgGlow)" />

  <!-- The Spark ✦: Innovation & AI -->
  <path d="M 39 3 C 39 6.5, 40.5 8, 44 8 C 40.5 8, 39 9.5, 39 13 C 39 9.5, 37.5 8, 34 8 C 37.5 8, 39 6.5, 39 3 Z" 
        fill="url(#svgSpark)" filter="url(#svgGlow)" />

  <!-- Typography -->
  <text x="56" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" letter-spacing="-0.5">Dev</text>
  <text x="96" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="22" fill="url(#svgBar3)" letter-spacing="-0.5">Collab</text>

  <!-- PRO badge -->
  <rect x="172" y="19" width="36" height="15" rx="7.5" fill="rgba(0, 217, 255, 0.12)" stroke="rgba(0, 217, 255, 0.3)" />
  <text x="180" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#00D9FF" letter-spacing="0.5">PRO</text>
</svg>
