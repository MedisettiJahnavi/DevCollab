<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DevCollab — Developers' Collaboration Platform</title>
  <meta name="description" content="DevCollab is a modern developer collaboration platform. Discover developers, real-time chat, HD voice communication, and team project collaboration." />

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN with configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              cyan: '#00d9ff',
              indigo: '#6366f1',
              purple: '#a855f7',
              violet: '#8b5cf6',
            },
            slate: {
              850: '#111827',
              900: '#0b0f19',
              950: '#080c14',
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.25s ease-out',
            'scale-up': 'scaleUp 0.2s cubic-bezier(0.16, 1, 0.3, 1)',
            'bounce-in': 'bounceIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(4px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            scaleUp: {
              '0%': { opacity: '0', transform: 'scale(0.96)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            bounceIn: {
              '0%': { opacity: '0', transform: 'translateY(12px) scale(0.95)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            }
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/custom.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-cyan-500 selection:text-slate-950 antialiased overflow-x-hidden">
  <!-- Main Application Mounting Container -->
  <div id="app-root"></div>

  <!-- Scripts in dependency order -->
  <script src="js/data.js"></script>
  <script src="js/logo.js"></script>
  <script src="js/audio-visualizer.js"></script>
  <script src="js/state.js"></script>
  <script src="js/components.js"></script>
  <script src="js/views/auth.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/discover.js"></script>
  <script src="js/views/profile.js"></script>
  <script src="js/views/chat.js"></script>
  <script src="js/views/voice.js"></script>
  <script src="js/views/projects.js"></script>
  <script src="js/views/notifications.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
